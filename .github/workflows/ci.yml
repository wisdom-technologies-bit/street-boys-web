# CI workflow. Documentation lives in CI.md; this file must stay valid YAML.

name: CI

on:
  pull_request:
  push:
    branches: [main]

# A new push to the same branch cancels the run in flight: the old result is stale.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  verify:
    name: lint, typecheck, test, build
    runs-on: ubuntu-latest
    timeout-minutes: 15

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: streetboys
          POSTGRES_PASSWORD: streetboys
          POSTGRES_DB: streetboys_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U streetboys -d streetboys_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      # Test-only credentials for the throwaway service container above.
      DATABASE_URL: postgresql://streetboys:streetboys@127.0.0.1:5432/streetboys_test
      DATABASE_URL_TEST: postgresql://streetboys:streetboys@127.0.0.1:5432/streetboys_test
      NEXT_TELEMETRY_DISABLED: '1'

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npx tsc --noEmit

      - name: Unit tests
        run: npm run test

      - name: Database tests (migrations against a real Postgres)
        run: npm run test:db

      - name: Build
        run: npm run build

  secrets:
    name: secret scan
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # Full history: a secret in an old commit is still a live secret.
          fetch-depth: 0

      - name: gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
